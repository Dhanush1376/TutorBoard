<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/TutorBoardLogo.png" />
    <link rel="apple-touch-icon" href="/TutorBoardLogo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TutorBoard AI | The Cinematic AI Learning Environment</title>
    <meta name="description" content="Master any subject with TutorBoard AI. A high-performance, cinematic AI teaching environment designed for deep learning, visualization, and doubt resolution." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tutor-board.vercel.app/" />
    <meta property="og:title" content="TutorBoard AI" />
    <meta property="og:description" content="Master any subject with TutorBoard AI. A high-performance, cinematic AI teaching environment designed for deep learning." />
    <meta property="og:image" content="https://tutor-board.vercel.app/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tutor-board.vercel.app/" />
    <meta property="twitter:title" content="TutorBoard AI | The Cinematic AI Learning Environment" />
    <meta property="twitter:description" content="Master any subject with TutorBoard AI. A high-performance, cinematic AI teaching environment." />
    <meta property="twitter:image" content="https://tutor-board.vercel.app/og-image.png" />
    <style>
      /* Critical Loader CSS — Prevents "black / white flash" before index.css loads */
      :root {
        --bg-primary: #fdfaf3;
        --text-primary: #0f0f0e;
        --accent: #1c1711;
      }

      /* Dark mode critical overrides */
      html.dark {
        --bg-primary: #050505;
        --text-primary: #fdfaf3;
        --accent: #fdfaf3;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        margin: 0;
        padding: 0;
        overflow: hidden;
        transition: background-color 0.3s ease;
      }
    </style>

    <!-- Synchronous theme initialization to prevent flicker -->
    <script>
      (function() {
        const mode = localStorage.getItem('tb-mode');
        const root = document.documentElement;
        if (mode === 'dark' || (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
