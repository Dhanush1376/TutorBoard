    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TutorBoard</title>
    <style>
      /* Critical Loader CSS — Prevents "black / white flash" before index.css loads */
      :root {
        --bg-primary: #fdfaf3;
        --text-primary: #0f0f0e;
        --accent: #1c1711;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>

    <!-- Synchronous theme initialization to prevent flicker -->
    <script>
      (function() {
        const mode = localStorage.getItem('tb-mode');
        const root = document.documentElement;
        if (mode === 'dark' || (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark');
          root.style.setProperty('--bg-primary', '#050505');
          root.style.setProperty('--text-primary', '#fdfaf3');
        } else {
          root.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
