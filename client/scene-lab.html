<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Lab — Engine v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #080705; --panel: #101010; --line: #262626; --ink: #f4f3ee; --dim: #8c8c8c; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Geist, Inter, system-ui, sans-serif; }
      body { display: grid; grid-template-columns: 260px 1fr 340px; grid-template-rows: 1fr auto; height: 100vh; }
      aside { border-right: 1px solid #1c1b19; padding: 18px 14px; overflow: auto; }
      aside h1 { font-size: 13px; letter-spacing: .22em; font-weight: 650; margin: 0 0 4px; }
      aside p { color: var(--dim); font-size: 12px; margin: 0 0 16px; }
      .fx { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; font: 500 13px Geist, sans-serif; cursor: pointer; }
      .fx:hover { background: rgba(255,255,255,.03); }
      .fx.on { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1); font-weight: 700; }
      .fx small { display: block; color: var(--dim); font-weight: 400; margin-top: 2px; }
      main { position: relative; overflow: hidden;
        background-color: var(--bg);
        background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
        background-size: 40px 40px; }
      #stage { position: absolute; inset: 0; }
      #panel { border-left: 1px solid #1c1b19; background: var(--panel); padding: 20px; overflow: auto; }
      #panel .label { font-size: 8.5px; font-weight: 700; letter-spacing: .2em; color: rgba(244,244,244,.5); text-transform: uppercase; margin: 18px 0 8px; }
      #panel .card { border-radius: 18px; padding: 16px; background: rgba(245,158,11,.02); border: 1px solid rgba(255,255,255,.05); font-size: 12.5px; font-weight: 300; line-height: 1.7; }
      #panel h2 { font-size: 15px; margin: 0; }
      #panel .meta { color: var(--dim); font: 500 11px "JetBrains Mono", monospace; margin-top: 4px; }
      #audit { font: 500 11px "JetBrains Mono", monospace; color: var(--dim); white-space: pre-wrap; }
      #audit .bad { color: #ef4444; } #audit .ok { color: #22c55e; }
      .ask textarea { width: 100%; resize: vertical; background: #0a0a0a; color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font: 400 13px Geist, sans-serif; }
      .ask .row { display: flex; gap: 8px; margin-top: 8px; }
      .ask select { flex: 1; background: #101010; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 6px; font: 500 12px Geist, sans-serif; }
      .ask button { background: var(--ink); color: #111; border: 0; border-radius: 10px; padding: 7px 14px; font: 700 12px Geist, sans-serif; cursor: pointer; }
      .ask button:disabled { opacity: .45; cursor: wait; }
      #status { font: 500 11px "JetBrains Mono", monospace; color: var(--dim); margin-top: 8px; white-space: pre-wrap; }
      .sec { font-size: 9px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: rgba(244,244,244,.45); margin: 18px 4px 6px; }
      footer { grid-column: 1 / 4; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-top: 1px solid #1c1b19; background: #0a0a0a; }
      footer button { background: #101010; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font: 600 12px Geist, sans-serif; cursor: pointer; }
      footer button.primary { background: var(--ink); color: #111; border-color: var(--ink); }
      .pills { display: flex; gap: 8px; margin: 0 14px; }
      .pill { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; font: 600 12px Geist, sans-serif; background: #1a1917; border: 1px solid #343330; color: #a3a3a3; cursor: pointer; }
      .pill.done { background: #0f2e1d; border-color: #1d5c3a; color: #34d399; }
      .pill.on { background: var(--ink); color: #111; border-color: var(--ink); }
      #time { font: 500 11px "JetBrains Mono", monospace; color: var(--dim); min-width: 110px; text-align: center; }
    </style>
  </head>
  <body>
    <aside>
      <h1>SCENE LAB</h1>
      <p>Engine v2 · Scene Language v1.</p>
      <div class="ask">
        <textarea id="q" rows="3" placeholder="Ask anything… e.g. How does binary search find 23?"></textarea>
        <div class="row">
          <select id="quality"><option value="best">Best model</option><option value="fast">Fast model</option></select>
          <button id="go">Generate</button>
        </div>
        <div id="status"></div>
      </div>
      <div class="sec">AI-generated</div>
      <div id="generated"></div>
      <div class="sec">Golden scenes (engine tests)</div>
      <div id="list"></div>
    </aside>
    <main><div id="stage"></div></main>
    <section id="panel">
      <h2 id="title">—</h2>
      <div class="meta" id="meta"></div>
      <div class="label">Step</div>
      <div class="card"><b id="beatTitle"></b><div id="narration" style="margin-top:6px"></div></div>
      <div class="label">Layout audit</div>
      <div id="audit"></div>
    </section>
    <footer>
      <button id="prev">◀ Prev</button>
      <button id="playBeat" class="primary">▶ Play step</button>
      <button id="playAll">▶▶ Play all</button>
      <button id="pause">❚❚ Pause</button>
      <button id="next">Next ▶</button>
      <div class="pills" id="pills"></div>
      <span id="time"></span>
      <button id="speed">1×</button>
    </footer>
    <script type="module" src="/src/dev/sceneLab.ts"></script>
  </body>
</html>
