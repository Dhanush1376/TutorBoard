name: TutorBoard CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          server/package-lock.json
          client/package-lock.json

    - name: Install Server Dependencies
      working-directory: ./server
      run: npm install

    - name: Install Client Dependencies
      working-directory: ./client
      run: npm install

    - name: Lint Server
      working-directory: ./server
      run: npm run lint || echo "No lint script found, skipping server linting."

    - name: Lint Client
      working-directory: ./client
      run: npm run lint || echo "No lint script found, skipping client linting."

    - name: Run Server Tests
      working-directory: ./server
      run: npm test
      env:
        MONGODB_URI: mongodb://localhost:27017/test
        JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}

    - name: Typecheck Server
      working-directory: ./server
      run: npm run build

    - name: Build Client
      working-directory: ./client
      run: npm run build
      env:
        VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

    - name: Validate Server Docker Build
      working-directory: ./server
      run: docker build -t tutorboard-server-test .

    - name: Install Root Dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E Tests
      run: npx playwright test
      env:
        MONGODB_URI: mongodb://localhost:27017/test
        JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  deploy-client:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client
          vercel-args: '--prod'

  deploy-server:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --fail \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
